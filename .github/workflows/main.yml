name: Deploy main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull and restart with Docker Compose
        uses: appleboy/ssh-action@v1.2.2
        env:
          PROD_APP_DIR: ${{ vars.PROD_APP_DIR || '/home/azureuser/exim_logipod/exim-tms' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 20m
          envs: PROD_APP_DIR,GITHUB_TOKEN,GITHUB_REPOSITORY
          script: |
            set -euo pipefail

            APP_DIR="$PROD_APP_DIR"
            cd "$APP_DIR"

            git fetch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
            git checkout main
            git reset --hard FETCH_HEAD

            chmod +x "$APP_DIR/scripts/start_production.sh"
            "$APP_DIR/scripts/start_production.sh"
