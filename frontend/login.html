<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Logipod Atlas</title>
    <link href="css/styles.css" rel="stylesheet">
    <link href="css/login.css" rel="stylesheet">
    <link href="css/modal.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body class="login-page">
    <div class="login-layout">
        <div class="login-panel">
            <div class="login-panel-inner">
                <a href="/login" class="login-brand" aria-label="Logipod Atlas home">
                    <img src="logipod-atlas-logo.png" alt="Logipod Atlas" class="login-brand-logo">
                </a>

                <div class="login-form-wrap">
                    <div class="login-header">
                        <h1 class="login-title">Login</h1>
                        <p class="login-subtitle">Enter your credentials to access your dashboard</p>
                    </div>

                    <form class="login-form" id="loginForm">
                        <div class="form-group">
                            <label for="userId">Email <span class="required" aria-hidden="true">*</span></label>
                            <input type="text" id="userId" name="userId" placeholder="Enter your email" required
                                autocomplete="username">
                        </div>

                        <div class="form-group">
                            <label for="password">Password <span class="required" aria-hidden="true">*</span></label>
                            <div class="password-field">
                                <input type="password" id="password" name="password" placeholder="Enter your password"
                                    required autocomplete="current-password">
                                <button type="button" class="password-toggle" id="passwordToggle"
                                    aria-label="Show password" aria-pressed="false">
                                    <i class="fas fa-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-login">
                            <span>Enter Atlas</span>
                            <i class="fas fa-arrow-right" aria-hidden="true"></i>
                        </button>
                    </form>
                </div>

                <div class="login-legal">
                    <p>By clicking continue, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy
                            Policy</a>.</p>
                    <p class="login-copyright">&copy; 2026 Atlas &bull; All rights reserved.</p>
                </div>
            </div>
        </div>

        <div class="login-hero" aria-hidden="true">
            <div class="login-hero-sky">
                <span class="login-hero-cloud login-hero-cloud--1"></span>
                <span class="login-hero-cloud login-hero-cloud--2"></span>
            </div>
            <img src="login-hero.png" alt="" class="login-hero-image">
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script>
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');

        passwordToggle.addEventListener('click', function () {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            passwordToggle.setAttribute('aria-pressed', String(isHidden));
            passwordToggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
            passwordToggle.querySelector('i').className = isHidden ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.getElementById('userId').value;
            const password = document.getElementById('password').value;

            const btn = this.querySelector('.btn-login');
            const originalText = btn.innerHTML;

            btn.innerHTML = '<i class="fas fa-spinner fa-spin" aria-hidden="true"></i> Authenticating...';
            btn.disabled = true;

            try {
                const response = await fetch(`${CONFIG.API_URL}/api/auth/login-json`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();

                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('user', data.username);
                    localStorage.setItem('token', data.access_token);

                    window.location.href = '/';
                } else {
                    const error = await response.json();
                    throw new Error(error.detail || 'Authentication failed');
                }
            } catch (error) {
                console.error('Login error:', error);
                btn.innerHTML = originalText;
                btn.disabled = false;
                showModal('Login Failed', error.message || 'Please enter valid credentials', 'error');
            }
        });
    </script>
</body>

</html>
