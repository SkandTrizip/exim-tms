<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ATLAS EXIM</title>
    <link rel="icon" type="image/png" href="Logipod_Logo.png">
    <link href="css/login.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="login-page">
    <div class="login-layout">
        <div class="login-panel">
            <a href="/login" class="login-brand" aria-label="ATLAS EXIM home">
                <img src="logo.svg" alt="Logipod Atlas" class="login-brand-logo">
            </a>

            <div class="login-panel-center">
                <div class="login-form-wrap">
                    <div class="login-form-content">
                        <div class="login-header">
                            <h1 class="login-title">Login</h1>
                            <p class="login-subtitle">Enter your credentials to access your dashboard</p>
                        </div>

                        <form class="login-form" id="loginForm" novalidate>
                            <div class="form-group">
                                <label for="userId">Email <span class="required" aria-hidden="true">*</span></label>
                                <input type="email" id="userId" name="userId" placeholder="Enter your email" required
                                    autocomplete="username">
                            </div>

                            <div class="form-group">
                                <label for="password">Password <span class="required" aria-hidden="true">*</span></label>
                                <div class="password-field">
                                    <input type="password" id="password" name="password"
                                        placeholder="Enter your password" required autocomplete="current-password">
                                    <button type="button" class="password-toggle" id="passwordToggle"
                                        aria-label="Show password" aria-pressed="false">
                                        <i class="fas fa-eye" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn-login" id="loginBtn">
                                <span class="btn-login-text">Enter Atlas</span>
                                <i class="fas fa-arrow-right btn-login-arrow" aria-hidden="true"></i>
                            </button>

                            <p class="login-error" id="loginError" role="alert" hidden></p>
                        </form>

                        <div class="login-legal">
                            <p>By clicking continue, you agree to our <a href="#">Terms of Service</a> and <a
                                    href="#">Privacy Policy</a>.</p>
                            <p class="login-copyright">&copy; 2026 Atlas &bull; All rights reserved.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="login-hero" aria-hidden="true">
            <img src="6228112 (1).jpg" alt="" class="login-hero-image">
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');
        const btnDefaultHtml = loginBtn.innerHTML;

        function showLoginError(message) {
            loginError.textContent = message;
            loginError.hidden = false;
            loginForm.classList.add('login-form--shake');
            setTimeout(() => loginForm.classList.remove('login-form--shake'), 250);
        }

        function clearLoginError() {
            loginError.textContent = '';
            loginError.hidden = true;
        }

        passwordToggle.addEventListener('click', function () {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            passwordToggle.setAttribute('aria-pressed', String(isHidden));
            passwordToggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
            passwordToggle.querySelector('i').className = isHidden ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        [passwordInput, document.getElementById('userId')].forEach((input) => {
            input.addEventListener('input', clearLoginError);
        });

        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            clearLoginError();

            const username = document.getElementById('userId').value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showLoginError('Please enter your email and password.');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin" aria-hidden="true"></i><span>Authenticating...</span>';

            try {
                const response = await fetch(`${CONFIG.API_URL}/api/auth/login-json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('user', data.username);
                    localStorage.setItem('token', data.access_token);
                    window.location.href = '/';
                } else {
                    const error = await response.json();
                    throw new Error(error.detail || 'Login failed. Please try again.');
                }
            } catch (error) {
                console.error('Login error:', error);
                loginBtn.disabled = false;
                loginBtn.innerHTML = btnDefaultHtml;
                showLoginError(error.message || 'Login failed. Please try again.');
            }
        });
    </script>
</body>

</html>
